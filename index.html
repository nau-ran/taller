<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COAders · Portal</title>
  <meta name="description" content="Portal central del taller de programació" data-t-content="descripcion">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="css/estilos.css?v=2026-11-13-1">
  <!-- El orden importa: config → contenido → textos → lógica. El ?v= va igual en los cinco y
       se cambia con cada versión: GitHub Pages cachea 10 min y, sin él, un navegador podía
       mezclar el index nuevo con un JS viejo (QA del catalán, H-09). -->
  <script src="js/config.js?v=2026-11-13-1" defer></script>
  <script src="js/sesiones.js?v=2026-11-13-1" defer></script>
  <script src="js/textos.js?v=2026-11-13-1" defer></script>
  <script src="js/app.js?v=2026-11-13-1" defer></script>
</head>
<body>
  <div id="banner-profe" class="banner-profe" hidden></div>

  <header class="cabecera">
    <div class="marca"><span class="marca-rayo">⚡</span> <span id="nombre-taller">COAders</span></div>
    <div class="xp" aria-label="Progrés del taller" data-t-aria="progreso">
      <div class="xp-texto"><span id="xp-sesion">Sessió 1</span> de 9</div>
      <div class="xp-barra"><div id="xp-relleno" class="xp-relleno"></div></div>
    </div>
    <div class="sprint">
      <button id="sprint-btn" class="btn-sprint" type="button" title="Temporitzador de concentració" data-t-title="temporizador">⏱ Sprint</button>
      <div id="sprint-opciones" class="sprint-opciones" hidden>
        <button type="button" data-min="5">5 min</button>
        <button type="button" data-min="10">10 min</button>
        <button type="button" data-min="15">15 min</button>
      </div>
    </div>
    <div id="idiomas" class="idiomas" role="group" aria-label="Llengua · Idioma">
      <button type="button" data-idioma="ca" lang="ca" aria-pressed="true">CA</button>
      <button type="button" data-idioma="es" lang="es" aria-pressed="false">ES</button>
    </div>
  </header>

  <main class="contenedor">
    <!-- La misión: hoy, o una pasada en modo repaso -->
    <section id="mision" class="mision" aria-live="polite"></section>

    <section class="bloque">
      <h2 class="bloque-titulo" data-t="mapa">🗺️ Mapa de missions</h2>
      <div id="mapa" class="mapa"></div>
    </section>

    <!-- Cómo guardar en el correo: lo enlazan las misiones («Antes de irte») y la carpeta (#correo) -->
    <section id="correo" class="bloque correo">
      <h2 class="bloque-titulo"><span data-t="correoTitulo">📧 Desa-ho al teu correu</span> <span class="etiqueta" data-t="correoEtiqueta">Sempre funciona</span></h2>
      <div id="correo-contenido" class="correo-columnas"></div>
    </section>

    <section id="zona" class="bloque zona" hidden>
      <h2 class="bloque-titulo"><span data-t="zona">🚀 Zona Autònoma</span> <span class="etiqueta" data-t="sigueTu">Has acabat? Continua tu!</span></h2>
      <div class="pestanas" role="tablist">
        <button type="button" role="tab" data-tab="retos" class="pestana activa" data-t="retosExtra">🏆 Reptes extra</button>
        <button type="button" role="tab" data-tab="atajos" class="pestana" data-t="atajos">⌨️ Dreceres</button>
        <button type="button" role="tab" data-tab="investiga" class="pestana">🔬 Investiga</button>
      </div>
      <div id="zona-contenido" class="zona-contenido"></div>
    </section>
  </main>

  <footer class="pie">
    <span><span data-t="seBorran">Els ordinadors s'esborren en apagar-los:</span> <a class="pie-enlace" href="#correo"><strong data-t="guardaEnlace">desa sempre la teva feina</strong></a> 💾</span>
    <a id="pie-carpeta" class="btn-carpeta" href="https://taller.nauran.dev/" target="_blank" rel="noopener" data-t="tuCarpeta">💾 La teva carpeta</a>
    <button id="abrir-profe" class="btn-profe" type="button" title="Tauler del profe" data-t-title="panelProfe" data-t-aria="panelProfe" aria-label="Tauler del profe">🔧</button>
  </footer>

  <dialog id="dialogo-profe" class="dialogo"></dialog>
  <div id="celebracion" class="celebracion" hidden></div>
</body>
</html>
